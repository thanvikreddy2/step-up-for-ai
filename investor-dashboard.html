<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investor Dashboard | StepUp for AI</title>
  <!-- GOOGLE FONT: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- FONT AWESOME (reusing exact version from home.html) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- DASHBOARD STYLES -->
  <link rel="stylesheet" href="investor-dashboard.css">
</head>
<body>
  <!-- App Container -->
  <div class="app-container">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <i class="fa-solid fa-chart-line logo-icon"></i>
          <span class="logo-text">StepUp <span class="logo-accent">for AI</span></span>
        </div>
        <button class="btn-close-sidebar" id="closeSidebar" aria-label="Close Sidebar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <nav class="sidebar-nav">
        <ul>
          <li>
            <button class="nav-item active" data-panel="pitch-decks">
              <i class="fa-solid fa-briefcase"></i>
              <span>Pitch Decks</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-panel="profile">
              <i class="fa-solid fa-user-tie"></i>
              <span>Investor Profile</span>
            </button>
          </li>
          <li>
            <button class="nav-item" data-panel="contact">
              <i class="fa-solid fa-envelope"></i>
              <span>Contact Details</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile-sm">
          <div class="avatar-sm">JD</div>
          <div class="user-info-sm">
            <h4 class="user-name">John Doe</h4>
            <span class="user-role">Vetted Investor</span>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <div class="main-content">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn-hamburger" id="hamburgerMenu" aria-label="Open Sidebar">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h1 class="panel-title" id="panelTitle">Pitch Decks</h1>
        </div>

        <div class="topbar-right">
          <div class="investor-badge">
            <i class="fa-solid fa-circle-check"></i>
            <span>Verified Investor</span>
          </div>
          <button class="btn-logout" id="btnLogout" aria-label="Logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
          </button>
        </div>
      </header>

      <!-- PANELS CONTAINER -->
      <main class="panels-container">
        <!-- PANEL 1: PITCH DECKS -->
        <section id="panel-pitch-decks" class="dashboard-panel active">
          <!-- Pitch decks panel content goes here -->
          <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
            <h2>Pitch Decks Panel</h2>
            <p>Content is loading...</p>
          </div>
        </section>

        <!-- PANEL 2: INVESTOR PROFILE -->
        <section id="panel-profile" class="dashboard-panel">
          <!-- Investor profile panel content goes here -->
          <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
            <h2>Investor Profile Panel</h2>
            <p>Content is loading...</p>
          </div>
        </section>

        <!-- PANEL 3: CONTACT DETAILS -->
        <section id="panel-contact" class="dashboard-panel">
          <!-- Contact details panel content goes here -->
          <div style="padding: 2rem; text-align: center; color: var(--text-secondary);">
            <h2>Contact Details Panel</h2>
            <p>Content is loading...</p>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- DASHBOARD SCRIPT -->
  <script src="investor-dashboard.js"></script>
</body>
</html>
